name: Android client
on:
  push:
    branches: [android-client]
    paths: ['AndroidClient/**', '.github/workflows/android-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Protocol checks
        run: AndroidClient/tests/run.sh
      - name: Build debug APK
        working-directory: AndroidClient
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sill-android-debug
          path: AndroidClient/app/build/outputs/apk/debug/app-debug.apk
